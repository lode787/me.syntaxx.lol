name: Update Cursor activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cursor-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh cursor-activity.json
        run: python scripts/update_cursor_activity.py
        env:
          CURSOR_HANDLE: syntaxx

      - name: Commit if the graph changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cursor-activity.json
          if git diff --staged --quiet; then
            echo "No activity changes"
            exit 0
          fi
          git commit -m "Refresh Cursor activity graph"
          git push
